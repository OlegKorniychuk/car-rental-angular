<body>
  <ul class="car-list">
    <li class="car-list-element" *ngFor="let car of carList">
      <p>Model: {{car.make}}</p>
      <p>Type: {{car.type}}</p>
      <p>Production Year: {{car.productionYear}}</p>
      <p>Daily Rent Price: {{car.rentPerDay}}</p>
      <p *ngIf="car.isAvailable; else elseBlock">Available</p>
      <ng-template #elseBlock>
        <p>Not Available</p>
      </ng-template>
      <button>Rent</button>
    </li>
  </ul>
</body>
