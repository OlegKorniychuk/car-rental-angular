<body class="main-container">
  <mat-card class="card-centered">
    <mat-card-content>
      <mat-card-header>
        <h2>Register</h2>
      </mat-card-header>
      <form [formGroup]="registerForm" (ngSubmit)="submitForm()">
        <mat-form-field class="full-width">
          <mat-label>First Name:</mat-label>
          <input matInput formControlName="firstName">
        </mat-form-field>
        <mat-form-field class="full-width">
          <mat-label>Middle Name:</mat-label>
          <input matInput formControlName="middleName">
        </mat-form-field>
        <mat-form-field class="full-width">
          <mat-label>Last Name:</mat-label>
          <input matInput formControlName="surname">
        </mat-form-field>
        <mat-form-field class="full-width">
          <mat-label>Address:</mat-label>
          <input matInput formControlName="address">
        </mat-form-field>
        <mat-form-field class="full-width">
          <mat-label>Phone Number:</mat-label>
          <input matInput formControlName="phoneNumber" type="tel">
        </mat-form-field>
        <mat-form-field class="full-width">
          <mat-label>Password:</mat-label>
          <input matInput formControlName="password" type="password">
        </mat-form-field>
        <mat-form-field class="full-width">
          <mat-label>Confirm Password:</mat-label>
          <input matInput formControlName="confirmPassword" type="password">
        </mat-form-field>
        <div>
          <button mat-flat-button type="submit" [disabled]="registerForm.invalid">Register</button>
        </div>
        <p *ngIf="registerForm.controls['confirmPassword'].hasError('passwordsMismatch')">
          Passwords do not match
        </p>
      </form>
      <mat-card-footer>
        <div>
          <p>Already have an account?</p>
          <a mat-button routerLink="/login">Log In</a>
        </div>
      </mat-card-footer>
    </mat-card-content>
  </mat-card>
</body>
